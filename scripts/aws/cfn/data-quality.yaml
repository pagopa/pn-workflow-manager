AWSTemplateFormatVersion: '2010-09-09'
Description: Data quality template, creates a nested stack for the campaign statistics Glue Table and Crawler

Parameters:
  TemplateBucketBaseUrl:
    Type: String
    Description: The S3 bucket from which to fetch the templates used by this stack.

  GlueServiceRoleArn:
    Type: String
    Description: Service role for the Glue Crawler.

  LogsBucketName:
    Type: String
    Description: Logs bucket name

  GlueDatabaseName:
    Type: String
    Description: Name of the Glue Database

  CampaignStatisticsTableName:
    Type: String
    Description: |
      DynamoDB table name for campaign statistics, also used to identify the S3
      directory where related CDC files are stored. Supply this value from the
      CampaignStatisticsTableName output of the storage stack.

  CampaignStatisticsGlueTableName:
    Type: String
    AllowedPattern: '^[a-z_]+$'
    ConstraintDescription: |
      Glue table name for campaign statistics, accepts only lowercase letters and underscores.
    Default: pn_campaign_statistics

Resources:
  PnCampaignStatisticsDataQualityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub ${TemplateBucketBaseUrl}/fragments/cdc-glue.yaml
      Parameters:
        DynamoTableName: !Ref CampaignStatisticsTableName
        GlueTableName: !Ref CampaignStatisticsGlueTableName
        GlueServiceRoleArn: !Ref GlueServiceRoleArn
        LogsBucketName: !Ref LogsBucketName
        GlueDatabaseName: !Ref GlueDatabaseName
        # Mapping Logico:
        # pk = senderId
        # sk = campaignId
        DynamoDBKeysStructure: |
          struct<senderId:struct<S:string>,campaignId:struct<S:string>>
        DynamoDBNewImageStructure: |
          struct<
            senderId:struct<S:string>,
            campaignId:struct<S:string>,
            totalSent:struct<N:string>,
            totalAccepted:struct<N:string>,
            totalRefused:struct<N:string>,
            totalViewed:struct<N:string>,
            totalUndeliverable:struct<N:string>,
            totalDelivered:struct<N:string>,
            workflowDone:struct<N:string>,
            digitalSentIO:struct<N:string>,
            digitalSentEMAIL:struct<N:string>,
            digitalSentPEC:struct<N:string>,
            digitalSentSMS:struct<N:string>,
            analogSentRS:struct<N:string>,
            receivedIO:struct<N:string>,
            receivedEMAIL:struct<N:string>,
            receivedPEC:struct<N:string>,
            receivedRS:struct<N:string>,
            viewedIO:struct<N:string>,
            firstViewedCount:struct<NULL:boolean,N:string>
            viewedSEND:struct<N:string>,
            paid:struct<N:string>,
            lastCompletedTimestamp:struct<S:string>
          >
