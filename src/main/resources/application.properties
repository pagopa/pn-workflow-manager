logging.config=classpath:logback-base.xml

pn.env.runtime=PROD
spring.application.name=pn-workflow-manager

management.endpoints.web.exposure.include=health,metrics,loggers

#AWS
aws.region-code=us-east-1
aws.profile-name=${PN_AWS_PROFILE_NAME:default}
aws.endpoint-url=http://localhost:4566
spring.cloud.aws.region.static=${AWS_REGIONCODE:us-east-1}
# Queue inbound event configuration
pn.workflow-manager.topics.action-queue=pn-workflow-manager_action
pn.workflow-manager.topics.digital-queue=pn-workflow-manager_digital_event
pn.workflow-manager.topics.analog-queue=pn-workflow-manager_analog_event
pn.workflow-manager.topics.io-queue=pn-workflow-manager_io_event
pn.workflow-manager.topics.informal-queue=pn-workflow_manager_inputs
pn.workflow-manager.topics.safe-storage-events=pn-safestore_to_workflowmanager
pn.workflow-manager.topics.national-registries-to-workflow-manager=pn-nationalregistries_to_workflowmanager

#external client
pn.workflow-manager.delivery-base-url=http://localhost:8090
pn.workflow-manager.timeline-client-base-url=http://localhost:8093
pn.workflow-manager.external-channels-base-url=http://localhost:8096
pn.workflow-manager.action-manager-base-url=http://localhost:8092
pn.workflow-manager.template-engine-base-url=http://localhost:8095
pn.workflow-manager.io-connector-base-url=http://localhost:8094
pn.workflow-manager.safe-storage-base-url=http://localhost:8094
pn.workflow-manager.national-registries-base-url=http://localhost:8097
pn.workflow-manager.user-attributes-base-url=http://localhost:8085
pn.workflow-manager.paper-messages-client-base-url=http://localhost:8097

#Dynamo Db
pn.workflow-manager.dao.campaign-statistics-table-name=${PN_WORKFLOWMANAGER_DAO_CAMPAIGNSTATISTICSTABLENAME:pn-CampaignStatistics}
campaign.table-name=${PN_WORKFLOWMANAGER_CAMPAIGNS_TABLE_NAME:pn-Campaigns}

pn.workflow-manager.paper-channel.sender-address.fullname=PagoPA S.p.A.
pn.workflow-manager.paper-channel.sender-address.address=Via Sardegna n. 38
pn.workflow-manager.paper-channel.sender-address.zipcode=00187
pn.workflow-manager.paper-channel.sender-address.city=Roma
pn.workflow-manager.paper-channel.sender-address.pr=Roma
pn.workflow-manager.paper-channel.sender-address.country=Italia

pn.workflow-manager.pn-send-mode=1970-01-01T00:00:00Z;DOCUMENTS;DOCUMENTS|PAYMENTS;COVERPAGE|DOCUMENTS|PAYMENTS
pn.workflow-manager.cx-id=pn-workflow-manager
pn.workflow-manager.io-polling-max-mins=5